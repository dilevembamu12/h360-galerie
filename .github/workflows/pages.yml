name: Déploiement GitHub Pages

# Publie la galerie (racine du dépôt) sur GitHub Pages.
# Au premier passage, le workflow ACTIVE GitHub Pages automatiquement
# (enablement: true) — aucun réglage manuel nécessaire.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupération du contenu
        uses: actions/checkout@v4

      - name: Nettoyage (retirer .git de l'artefact)
        run: rm -rf .git

      - name: Configuration de Pages (activation automatique)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Archivage du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
